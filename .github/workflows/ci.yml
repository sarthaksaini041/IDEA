name: CI

# push -> install -> typecheck -> unit tests -> production build.
# Vercel deploys from GitHub on its own; to stop a red build reaching production, enable
# branch protection on `main` requiring the "CI / checks" status (see improvement.md).
on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tinylabfinder.online
